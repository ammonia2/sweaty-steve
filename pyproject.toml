[project]
name = "sweaty-steve"
version = "0.1.0"
description = "Nash, Bayesian and PPO bots for 1v1 football (Game Theory semester project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

# gtbots/ is imported straight from the repo root; nothing is built or installed.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import gtbots from the repo root, as `uv run python` does.
pythonpath = ["."]
